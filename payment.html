<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>💳 Payment</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="movies.php">Movies</a></li>
        <li><a href="view_bookings.php">My Bookings</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Complete Your Payment</h2>
    <form id="paymentForm">
      <label for="card-name">Cardholder Name</label>
      <input type="text" id="card-name" required />

      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" maxlength="16" required />

      <label for="expiry">Expiration Date</label>
      <input type="month" id="expiry" required />

      <label for="cvv">CVV</label>
      <input type="password" id="cvv" maxlength="4" required />

      <button type="submit">Pay Now</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Movie Ticket Booking System. IT-361 Web Technologies</p>
  </footer>

  <script>
    document.getElementById("paymentForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Payment processed successfully!");
      window.location.href = "thank_you.php";  // Redirect to the thank_you.php page
    });
  </script>
</body>
</html>
